name: Publish dashboard site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "data/dashboard.json"
      - "data/screener.json"
      - "pages/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.pages.config.ts"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
      - id: deployment
        uses: actions/deploy-pages@v4
